<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Musica - Lecteur WaveSurfer</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://unpkg.com/axios@1.4.0/dist/axios.min.js"></script>
<script src="https://unpkg.com/wavesurfer.js"></script>
<style>
  body { margin: 0; background: #000; color: #fff; font-family: sans-serif; text-align: center; }
  .container { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; position: relative; }
  /* .mode-switch { position: absolute; top: 20px; right: 20px; z-index: 10; } */
/* Position fixe en haut à droite */
.mode-switch { 
  position: absolute; 
  top: 25px; 
  right: 25px; 
  z-index: 1000; 
}

/* Style "Ghost Button" professionnel */
.nav-btn {
  background: transparent;
  color: #ffffff;
  border: 1px solid rgba(255, 255, 255, 0.3);
  padding: 10px 20px;
  font-family: 'Inter', sans-serif;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 2px;
  cursor: pointer;
  transition: all 0.3s ease;
  backdrop-filter: blur(5px); /* Effet verre poli */
}

/* Effet au survol */
.nav-btn:hover:not(:disabled) {
  background: #ffffff;
  color: #000000;
  border-color: #ffffff;
  box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
}

/* État désactivé */
.nav-btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
  border-color: rgba(255, 255, 255, 0.1);
}


  
  .waveform-wrapper {
    position: relative;
    width: 100%;
    max-width: 900px;
    height: 250px;
    margin: 20px 0;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
  }
  
  .album-image {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center;
    z-index: 1;
    transition: clip-path 0.1s linear;
  }
  
  #waveform {
    position: relative;
    width: 100%; 
    height: 100%;
    z-index: 2;
    opacity: 0.5;
    filter: grayscale(100%);
  }
  
  .controls button { margin: 5px; padding: 10px 20px; font-size: 16px; cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }

  .player-controls {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    gap: 20px;
    z-index: 3;
    opacity: 0;                 
    transition: opacity 0.3s ease;
  }
  .waveform-wrapper:hover .player-controls { opacity: 1; }
  @media (hover: none) { .player-controls { opacity: 1; } }
  
  .player-controls button {
    appearance: none; -webkit-appearance: none; -moz-appearance: none;
    -webkit-tap-highlight-color: transparent; outline: none; border: none;
    border-radius: 50%; width: 55px; height: 55px;
    background: rgba(0,0,0,0.6); cursor: pointer;
    backdrop-filter: blur(5px);
    transition: all 0.2s ease;
    display: flex; justify-content: center; align-items: center; padding: 0;
  }
  .player-controls .play-btn { width: 70px; height: 70px; }
  .player-controls button svg { width: 60%; height: 60%; }
  .player-controls button:hover { background: rgba(255,255,255,0.25); transform: scale(1.1); }
  .player-controls button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .feedback-overlay {
    position: absolute; bottom: 15px; right: 15px;
    display: flex; gap: 12px; z-index: 4;
  }
  .feedback-btn {
    appearance: none; -webkit-appearance: none; -webkit-tap-highlight-color: transparent;
    border: none; border-radius: 50%; width: 50px; height: 50px; font-size: 18px;
    display: flex; justify-content: center; align-items: center;
    background: rgba(0,0,0,0.5); color: white; cursor: pointer;
    backdrop-filter: blur(5px); transition: all 0.2s ease;
  }
  .feedback-btn:hover { background: rgba(255,255,255,0.25); transform: scale(1.1); }
  .feedback-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .like-btn { background: rgba(0,200,0,0.5); }
  .dislike-btn { background: rgba(200,0,0,0.5); }

.weatherall-footer {
  position: fixed;
  bottom: 20px; /* Aligné sur le bas */
  left: 20px;   /* Aligné sur la gauche */
  z-index: 9999;
}

.weatherall-footer a {
  display: block;
  padding: 10px 15px;
  background: rgba(0, 0, 0, 0.3); /* Fond sombre discret */
  color: #aaa;
  text-decoration: none;
  border-radius: 5px;
  font-size: 14px;
  border: 1px solid rgba(255, 255, 255, 0.1);
}

.weatherall-footer a:hover {
  background: rgba(255, 255, 255, 0.1);
  color: #fff;
}
  
.mix-list {
  width: 100%;
  max-width: none;  /* ✅ Remove limit */
  padding: 10px 20px;  /* ✅ Plus de padding horizontal */
  margin-top: 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;  /* ✅ Espacement entre les items */
}

.mix-item {
  display: grid;
  grid-template-columns: 150px 1fr 150px 60px 100px;  /* ✅ Layout plus spacieux */
  align-items: center;
  gap: 15px;  /* ✅ Gap entre éléments */
  font-size: 14px;
  padding: 10px;
  border-radius: 8px;
  background: rgba(255,255,255,0.05);  /* ✅ Fond léger */
  transition: background 0.2s ease;
}

.mix-item:hover {
  background: rgba(255,255,255,0.1);
}

.mix-name {
  max-width: none;  /* ✅ Remove limit */
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex-shrink: 0;
  font-weight: 500;
}

.dots {
  display: none;  /* ✅ Remove dots, pas utile en grid */
}

.mix-waveform {
  width: 100%;
  height: 50px;  /* ✅ Plus grand */
  min-width: 150px;
  cursor: pointer;
}

.mix-controls {
  display: flex;
  align-items: center;
  gap: 8px;
}

.mix-play {
  background: rgba(0, 200, 100, 0.6);
  border: none;
  color: white;
  font-size: 16px;
  cursor: pointer;
  padding: 0;
  width: 45px;
  height: 45px;
  display: flex;
  justify-content: center;
  align-items: center;
  border-radius: 50%;
  transition: background 0.2s ease;
}

.mix-play:hover {
  background: rgba(0, 200, 100, 0.8);
}

.mix-time {
  font-size: 13px;
  opacity: 0.8;
  min-width: 100px;
  text-align: right;
}

/* ✅ RESPONSIVE MOBILE */
@media (max-width: 768px) {
  .mix-item {
    grid-template-columns: 80px 1fr 50px 70px;  /* ✅ Moins de colonnes */
    gap: 10px;
    padding: 8px;
  }

  .mix-name {
    font-size: 12px;
  }

  .mix-waveform {
    height: 40px;
    min-width: 100px;
  }

  .mix-time {
    font-size: 11px;
    min-width: 70px;
  }

  .mix-play {
    width: 40px;
    height: 40px;
  }
}

@media (max-width: 480px) {
  .mix-item {
    grid-template-columns: 60px 1fr 40px;  /* ✅ Minimal : nom + waveform + play */
    gap: 8px;
    padding: 6px;
  }

  .mix-name {
    font-size: 11px;
  }

  .mix-waveform {
    height: 35px;
    min-width: 80px;
  }

  .mix-time {
    display: none;  /* ✅ Hide time on mobile */
  }

  .mix-play {
    width: 38px;
    height: 38px;
    font-size: 14px;
  }
}

  .previous-songs {
    margin-top: 20px; margin-bottom: 10px;
    font-size: 14px; color: rgba(255, 255, 255, 0.4);
  }
  .prev-song { padding: 3px 0; }
  
  .time-display {
    font-size: 1.2em; margin-top: 10px;
  }

  .start-message {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 24px; color: rgba(255,255,255,0.8);
    z-index: 100; cursor: pointer; text-align: center;
  }
    
</style>
</head>
<body>
  <div id="app">
    <div class="container" :style="{ backgroundColor: bgColor, color: textColor }">

      <!-- <div class="mode-switch">
        <button @click="toggleMode" :disabled="isLoading">
          {{ mode === 'mp3' ? 'Go to MIX list' : 'Back to single MP3' }}
        </button>
      </div> -->
      

<div class="mode-switch">
  <button 
    class="nav-btn" 
    @click="toggleMode" 
    :disabled="isLoading"
    :class="{ 'loading': isLoading }"
  >
    {{ mode === 'mp3' ? 'Explore Mixes' : 'Return Home' }}
  </button>
</div>

      
      

      <div v-if="mode === 'mp3' && songHistory.length > 0" class="previous-songs">
        <div v-for="(song, idx) in songHistory.slice(1).reverse()" :key="idx" class="prev-song">
          {{ song }}
        </div>
      </div>
      
      <h1 v-if="mode === 'mp3'">{{ songName }}</h1>

      <p v-if="mode === 'mp3'" style="color: #0099ff; font-size: 14px; max-width: 600px; margin: 10px auto;">
        {{ songDescription }}
      </p>
      
      <div v-if="mode === 'mp3'" class="waveform-wrapper">
        <div class="album-image"
             :style="{ 
               backgroundImage: `url('${imageUrl}')`,
               clipPath: `inset(0 ${100 - progressPercent}% 0 0)`
             }">
        </div>
        <div id="waveform"></div>
        <div class="player-controls">
          <button @click="previousSong" :disabled="isLoading">
            <svg viewBox="0 0 24 24"><polygon points="11,12 22,4 22,20" fill="white"/><rect x="2" y="4" width="3" height="16" fill="white"/></svg>
          </button>
          <button type="button" class="play-btn" @click="togglePlay" :disabled="!isSongReady || isLoading">
            <svg v-if="!isPlaying" viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21" fill="white"/></svg>
            <svg v-else viewBox="0 0 24 24"><rect x="5" y="3" width="5" height="18" fill="white"/><rect x="14" y="3" width="5" height="18" fill="white"/></svg>
          </button>
          <button @click="replaySong" :disabled="!isSongReady || isLoading">
            <svg viewBox="0 0 24 24"><path d="M12 5V1L8 5l4 4V6c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6h-2c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z" fill="white"/></svg>
          </button>
          <button @click="nextSong" :disabled="isLoading">
            <svg viewBox="0 0 24 24"><polygon points="13,12 2,4 2,20" fill="white"/><rect x="19" y="4" width="3" height="16" fill="white"/></svg>
          </button>
        </div>
      </div>
      <div v-if="mode === 'mp3'" class="time-display">{{ currentTime }} / {{ duration }}</div>

      <audio ref="mixPlayer" style="display:none;"></audio>

<div v-if="mode === 'mix'" class="mix-list">
        <div v-for="mix in mixList"
          :key="mix.fileName"
          :class="['mix-item', { active: currentMix === mix.fileName && isMixPlaying }]"
        >
          <span class="mix-name" :title="mix.name">{{ mix.name }}</span>
          <div :id="'waveform-' + mix.fileName.replace(/[^a-zA-Z0-9]/g, '-').toLowerCase()" 
               class="mix-waveform" 
               @click="seekMix(mix, $event)">
          </div>
          <button class="mix-play" @click="toggleMixPlayPause(mix)">
            {{ currentMix === mix.fileName && isMixPlaying ? '⏸' : '▶' }}
          </button>
          <span class="mix-time">
            {{ currentMix === mix.fileName ? formatTime(mixCurrentTime) + ' / ' + formatTime(mixDuration) : '0:00 / 0:00' }}
          </span>
        </div>
      </div>


      <!-- Footer Left: Andrew Weatherall Archive -->
      <div class="weatherall-footer">
<!--        <a href="https://drive.google.com/drive/folders/0B23ZLBzfzfvec3ZhVE1uV0JtSGs?resourcekey=0-9-B7TSh8fZ8WQfmd20YkQw" target="_blank" rel="noopener noreferrer">
         Archives Andrew Weatherall -->
        <a href="https://storage.googleapis.com/musica-frontend-test/index.html" target="_blank" rel="noopener noreferrer">
         Test DJ Auto Harmonic 
         </a>
      </div>
      <div class="feedback-overlay">
        <button class="feedback-btn like-btn" @click="likeSong" :disabled="hasVoted">❤️ {{ globalLikeCount }}</button>
        <button class="feedback-btn dislike-btn" @click="dislikeSong" :disabled="hasVoted">👎 {{ globalDislikeCount }}</button>
      </div>

      <div v-if="!userInteracted && isSongReady" class="start-message">
        👆 Start music
      </div>
    </div>
  </div>

<script>
const { createApp } = Vue;

createApp({
  data() {
    return {
      mode: 'mp3',
      songName: 'Chargement...',
      songUrl: '',
      imageUrl: '',
      fileName: '',
      wavesurfer: null,
      isPlaying: false,
      isSongReady: false,
      isLoading: false,
      currentTime: '0:00',
      duration: '0:00',
      hasVoted: false,
      globalLikeCount: 0,
      globalDislikeCount: 0,
      bgColor: '#000',
      textColor: '#fff',
      userInteracted: false,
      progressPercent: 0,
      songHistory: [],
      songDescription: '',
      mixList: [],
      currentMix: null,
      mixPlayer: null,
      mixCurrentTime: 0,
      mixDuration: 0,
      mixWaveSurfers: {},
      isMixPlaying: false,
      mixInfoCache: {},
    };
  },

  mounted() {
    console.log('🚀 App mounted');

    const mp3WaveformContainer = document.getElementById('waveform');
    if (mp3WaveformContainer) {
      this.wavesurfer = WaveSurfer.create({
        container: '#waveform',
        waveColor: '#FFFFFF',
        progressColor: 'transparent',
        barWidth: 2,
        height: 250,
        responsive: true,
        cursorWidth: 2,
        cursorColor: '#fff',
        hideScrollbar: true,
      });

      this.wavesurfer.on('audioprocess', () => {
        this.currentTime = this.formatTime(this.wavesurfer.getCurrentTime());
        this.progressPercent = (this.wavesurfer.getCurrentTime() / this.wavesurfer.getDuration()) * 100;
      });

      this.wavesurfer.on('finish', () => {
        this.isPlaying = false;
        this.loadNextSong();
      });

      this.wavesurfer.once('ready', () => {
        this.isSongReady = true;
        this.duration = this.formatTime(this.wavesurfer.getDuration());
        console.log('✅ WaveSurfer MP3 ready');
      });
    }

    document.addEventListener('click', () => this.handleUserInteraction());
    document.addEventListener('touchstart', () => this.handleUserInteraction());
    document.addEventListener('keydown', () => this.handleUserInteraction());

    this.mixPlayer = this.$refs.mixPlayer;
    this.setupMixPlayerEvents();

    if (this.mode === 'mix') {
      this.fetchMixList();
    } else {
      if (!this.isLoading && !this.isSongReady) {
        this.loadNextSong();
      }
    }
  },

  beforeDestroy() {
    if (this.wavesurfer) this.wavesurfer.destroy();
    Object.values(this.mixWaveSurfers).forEach(ws => {
      if (ws) ws.destroy();
    });
  },

  methods: {
    handleUserInteraction() {
      if (!this.userInteracted) {
        console.log('✅ Autoplay déverrouillé');
        this.userInteracted = true;
        if (this.mode === 'mp3' && this.isSongReady) {
          this.playAudio();
        }
      }
    },

    async playAudio() {
      if (!this.wavesurfer || !this.isSongReady) return;
      try {
        await this.wavesurfer.play();
        this.isPlaying = true;
      } catch (e) {
      //  console.error('❌ Erreur playAudio:',toggle e);
            console.error('❌ Erreur playAudio:', e);  // ✅ FIXÉ

      }
    },

    pauseAudio() {
      if (this.wavesurfer) {
        this.wavesurfer.pause();
        this.isPlaying = false;
      }
    },

    togglePlay() {
      if (this.isPlaying) {
        this.pauseAudio();
      } else {
        this.playAudio();
      }
    },

    async replaySong() {
      if (!this.wavesurfer || !this.isSongReady) return;
     // this.wavesurfer.seek(0);
        this.wavesurfer.seekTo(0);  // ✅ Change seek() en seekTo()

      await this.playAudio();
    },

async loadNextSong() {
  this.isLoading = true;
  try {
    const res = await axios.get('/api/next-song?mode=mp3', { withCredentials: true });
    const data = res.data;

    this.songName = data.songName;
    this.songUrl = data.url;
    this.fileName = data.fileName;
    this.imageUrl = data.imageUrl || '';
    this.songDescription = data.description || '';
    this.globalLikeCount = data.likeCount || 0;
    this.globalDislikeCount = data.dislikeCount || 0;
    this.hasVoted = false;

    this.updateSongHistory(this.songName);

    if (this.wavesurfer) {
      this.isSongReady = false;
      this.currentTime = '0:00';
      this.progressPercent = 0;
      
      // ✅ DESTROY l'ancienne instance
      this.wavesurfer.destroy();
      
      // ✅ CRÉE une nouvelle instance
      this.wavesurfer = WaveSurfer.create({
        container: '#waveform',
        waveColor: '#FFFFFF',
        progressColor: 'transparent',
        barWidth: 2,
        height: 250,
        responsive: true,
        cursorWidth: 2,
        cursorColor: '#fff',
        hideScrollbar: true,
      });

      // ✅ RE-BRANCHE les événements
      this.wavesurfer.on('audioprocess', () => {
        this.currentTime = this.formatTime(this.wavesurfer.getCurrentTime());
        this.progressPercent = (this.wavesurfer.getCurrentTime() / this.wavesurfer.getDuration()) * 100;
      });

      this.wavesurfer.on('finish', () => {
        this.isPlaying = false;
        this.loadNextSong();
      });

      this.wavesurfer.once('ready', () => {
        this.isSongReady = true;
        this.duration = this.formatTime(this.wavesurfer.getDuration());
         // ✅ AJOUTE CETTE PARTIE : démarre automatiquement
        if (this.userInteracted && this.isPlaying) {
          this.playAudio();
        }
      });

      // ✅ CHARGE la nouvelle URL
      this.wavesurfer.load(this.songUrl);
    }
  } catch (e) {
    console.error('❌ loadNextSong error:', e);
  } finally {
    this.isLoading = false;
  }
},

async loadPreviousSong() {
  this.isLoading = true;
  try {
    const res = await axios.get('/api/previous-song?mode=mp3', { withCredentials: true });
    const data = res.data;

    this.songName = data.songName;
    this.songUrl = data.url;
    this.fileName = data.fileName;
    this.imageUrl = data.imageUrl || '';
    this.songDescription = data.description || '';
    this.globalLikeCount = data.likeCount || 0;
    this.globalDislikeCount = data.dislikeCount || 0;
    this.hasVoted = false;

    this.updateSongHistory(this.songName);

    if (this.wavesurfer) {
      this.isSongReady = false;
      this.currentTime = '0:00';
      this.progressPercent = 0;
      
      // ✅ DESTROY l'ancienne instance
      this.wavesurfer.destroy();
      
      // ✅ CRÉE une nouvelle instance
      this.wavesurfer = WaveSurfer.create({
        container: '#waveform',
        waveColor: '#FFFFFF',
        progressColor: 'transparent',
        barWidth: 2,
        height: 250,
        responsive: true,
        cursorWidth: 2,
        cursorColor: '#fff',
        hideScrollbar: true,
      });

      // ✅ RE-BRANCHE les événements
      this.wavesurfer.on('audioprocess', () => {
        this.currentTime = this.formatTime(this.wavesurfer.getCurrentTime());
        this.progressPercent = (this.wavesurfer.getCurrentTime() / this.wavesurfer.getDuration()) * 100;
      });

      this.wavesurfer.on('finish', () => {
        this.isPlaying = false;
        this.loadPreviousSong();
      });

      this.wavesurfer.once('ready', () => {
        this.isSongReady = true;
        this.duration = this.formatTime(this.wavesurfer.getDuration());
         // ✅ AJOUTE CETTE PARTIE : démarre automatiquement
        if (this.userInteracted && this.isPlaying) {
          this.playAudio();
        }
      });

      // ✅ CHARGE la nouvelle URL
      this.wavesurfer.load(this.songUrl);
    }
  } catch (e) {
    console.error('❌ loadPreviousSong error:', e);
  } finally {
    this.isLoading = false;
  }
},

    nextSong() {
      this.loadNextSong();
    },

    previousSong() {
      this.loadPreviousSong();
    },

    setupMixPlayerEvents() {
      if (!this.mixPlayer) return;

      this.mixPlayer.addEventListener('timeupdate', () => {
        this.mixCurrentTime = this.mixPlayer.currentTime;
      });

      this.mixPlayer.addEventListener('loadedmetadata', () => {
        this.mixDuration = this.mixPlayer.duration;
      });

      this.mixPlayer.addEventListener('ended', () => {
        this.isMixPlaying = false;
        this.mixCurrentTime = 0;
      });

      this.mixPlayer.addEventListener('play', () => {
        this.isMixPlaying = true;
      });

      this.mixPlayer.addEventListener('pause', () => {
        this.isMixPlaying = false;
      });
    },

    async fetchMixList() {
      try {
        const res = await axios.get('/api/mix-list', { withCredentials: true });
        this.mixList = res.data;
        console.log('✅ Mix List:', this.mixList);

        if (this.mode === 'mix' && this.mixList.length > 0) {
          this.$nextTick(() => {
            this.mixList.forEach(mix => this.initMixWaveformContainer(mix));
          });
        }
      } catch (err) {
        console.error('❌ Erreur /api/mix-list:', err);
      }
    },

    initMixWaveformContainer(mix) {
      if (!mix || !mix.fileName || !mix.url || !mix.waveformJsonUrl) {
        console.warn('⚠️ Mix invalide:', mix);
        return;
      }

      const safeFileName = mix.fileName.replace(/[^a-zA-Z0-9]/g, '-').toLowerCase();
      const waveformId = `waveform-${safeFileName}`;
      const container = document.getElementById(waveformId);

      if (!container) {
        console.error(`❌ Conteneur #${waveformId} non trouvé`);
        return;
      }

      try {
        const ws = WaveSurfer.create({
          container: `#${waveformId}`,
          waveColor: '#ffffff',
          progressColor: '#ff0000',
          barWidth: 3,
          barGap: 1,
          height: 40,
          responsive: true,
          cursorWidth: 2,
          cursorColor: '#fff',
          hideScrollbar: true,
        });

        this.mixWaveSurfers[mix.fileName] = ws;
        this.mixInfoCache[mix.fileName] = { url: mix.url, waveformJsonUrl: mix.waveformJsonUrl, duration: 0 , lastPosition: 0  };

        ws.on('ready', () => {
          const duration = ws.getDuration();
          if (duration && duration > 0) {
            this.mixInfoCache[mix.fileName].duration = duration;
            console.log(`✅ WaveSurfer ready for ${mix.fileName}: ${duration}s`);
          }
        });

        ws.on('audioprocess', (time) => {
          if (this.currentMix === mix.fileName) {
            this.mixCurrentTime = time;
          }
        });

        ws.on('seeking', (time) => {
          if (this.currentMix === mix.fileName && this.mixPlayer) {
            this.mixPlayer.currentTime = time;
          }
        });

       // ws.load(mix.waveformJsonUrl);
fetch(mix.waveformJsonUrl)
  .then(res => res.json())
  .then(data => {
    // Convertir array en peaks pour WaveSurfer (format: [min, max] par pixel)
    const peaks = [];
    const samplesPerPixel = data.samples_per_pixel || 1024;
    
    for (let i = 0; i < data.data.length; i += samplesPerPixel) {
      const chunk = data.data.slice(i, i + samplesPerPixel);
      const min = Math.min(...chunk);
      const max = Math.max(...chunk);
      peaks.push(min, max);
    }
    
    const duration = data.length / data.sample_rate;
    //ws.loadDecodedBuffer([peaks], duration);
    //ws.load()
    ws.load(mix.url, peaks, duration);  // ✅ CHARGE L'AUDIO + les peaks

    console.log(`✅ Waveform loaded for ${mix.fileName}`);
  })
  .catch(e => {
    console.warn(`⚠️ Pas de waveform pour ${mix.fileName}:`, e);
  });
        console.log(`✅ WaveSurfer init for: ${mix.fileName}`);
      } catch (e) {
        console.error(`❌ Erreur WaveSurfer pour ${mix.fileName}:`, e);
      }
    },

    seekMix(mix, event) {
      const ws = this.mixWaveSurfers[mix.fileName];
      if (!ws || this.currentMix !== mix.fileName) return;

      const waveWrapper = event.currentTarget;
      const clickX = event.offsetX;
      const waveWidth = waveWrapper.offsetWidth;
      const duration = this.mixPlayer.duration || ws.getDuration() || 0;

      if (duration === 0 || !isFinite(duration)) return;

      const seekTime = (clickX / waveWidth) * duration;
      if (this.mixPlayer) this.mixPlayer.currentTime = seekTime;
      ws.seek(seekTime);
    },
    
toggleMixPlayPause(mix) {
  const ws = this.mixWaveSurfers[mix.fileName];
  if (!ws) {
    console.error(`❌ WaveSurfer not found for: ${mix.fileName}`);
    return;
  }

  if (this.currentMix === mix.fileName && this.isMixPlaying) {
    // ✅ PAUSE : sauvegarder la position actuelle
    if (this.mixPlayer) {
      this.mixPlayer.pause();
      this.mixInfoCache[mix.fileName].lastPosition = this.mixPlayer.currentTime;
    }
    ws.pause();
    this.isMixPlaying = false;
  } else {
    // PLAY : restaurer la position sauvegardée
    this.currentMix = mix.fileName;

    if (this.wavesurfer && this.isPlaying) {
      this.wavesurfer.pause();
      this.isPlaying = false;
    }

    const mixInfo = this.mixInfoCache[mix.fileName];
    if (!mixInfo || !mixInfo.url) {
      console.error('❌ Mix info not found:', mix.fileName);
      return;
    }

    this.mixPlayer.src = `https://storage.googleapis.com/musica-mix-bucket/${mix.fileName}`;
    
    // ✅ Restaurer la position si elle existe
    const lastPosition = mixInfo.lastPosition || 0;
    this.mixPlayer.currentTime = lastPosition;
    
    this.mixPlayer.play().catch(e => {
      console.error('❌ Play error:', e);
      this.isMixPlaying = false;
    });
  }
}, // ✅ Virgule

    async toggleMode() {
      this.isLoading = true;

      if (this.mode === 'mp3' && this.isPlaying) {
        this.pauseAudio();
      } else if (this.mode === 'mix' && this.isMixPlaying) {
        if (this.mixPlayer) this.mixPlayer.pause();
        this.isMixPlaying = false;
      }

      this.mode = this.mode === 'mp3' ? 'mix' : 'mp3';

      if (this.mode === 'mp3') {
        await this.$nextTick();
        try {
          const res = await axios.get('/api/next-song?mode=mp3', { withCredentials: true });
          const data = res.data;

          this.songName = data.songName;
          this.songUrl = data.url;
          this.fileName = data.fileName;
          this.imageUrl = data.imageUrl || '';
          this.songDescription = data.description || '';
          this.globalLikeCount = data.likeCount || 0;
          this.globalDislikeCount = data.dislikeCount || 0;

          if (this.wavesurfer) this.wavesurfer.destroy();
          this.wavesurfer = WaveSurfer.create({
            container: '#waveform',
            waveColor: '#FFFFFF',
            progressColor: 'transparent',
            barWidth: 2,
            height: 250,
            responsive: true,
            cursorWidth: 2,
            cursorColor: '#fff',
            hideScrollbar: true,
          });

          this.wavesurfer.on('audioprocess', () => {
            this.currentTime = this.formatTime(this.wavesurfer.getCurrentTime());
            this.progressPercent = (this.wavesurfer.getCurrentTime() / this.wavesurfer.getDuration()) * 100;
          });

          this.wavesurfer.on('finish', () => {
            this.isPlaying = false;
            this.loadNextSong();
          });

          this.wavesurfer.once('ready', () => {
            this.isSongReady = true;
            this.duration = this.formatTime(this.wavesurfer.getDuration());
          });

          this.wavesurfer.load(this.songUrl);
        } catch (e) {
          console.error('❌ Error toggle MP3:', e);
        } finally {
          this.isLoading = false;
        }
      } else {
        await this.$nextTick();
        if (this.mixList.length === 0) {
          await this.fetchMixList();
        }
        this.isLoading = false;
      }
    },

    updateSongHistory(songName) {
      this.songHistory.unshift(songName);
      if (this.songHistory.length > 7) {
        this.songHistory.pop();
      }
    },

    async likeSong() {
      if (this.hasVoted) return;
      await this.sendFeedback('like');
    },

    async dislikeSong() {
      if (this.hasVoted) return;
      await this.sendFeedback('dislike');
    },

    async sendFeedback(feedbackType) {
      if (this.mode === 'mp3' && this.fileName) {
        try {
          this.hasVoted = true;
          const res = await axios.post('/api/song-feedback', { songName: this.fileName, feedback: feedbackType }, { withCredentials: true });
          this.globalLikeCount = res.data.likeCount || 0;
          this.globalDislikeCount = res.data.dislikeCount || 0;
        } catch (err) {
          console.error(`❌ Feedback error:`, err);
          this.hasVoted = false;
        }
      }
    },

    formatTime(sec) {
      if (!sec || !isFinite(sec)) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' + s : s}`;
    },
  }
}).mount('#app');
</script>
