<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Musica - Lecteur WaveSurfer</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://unpkg.com/axios@1.4.0/dist/axios.min.js"></script>
<script src="https://unpkg.com/wavesurfer.js"></script>
<style>
  body { margin: 0; background: #000; color: #fff; font-family: sans-serif; text-align: center; }
  .container { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; position: relative; }
  .mode-switch { position: absolute; top: 20px; right: 20px; z-index: 10; }
  
  .waveform-wrapper {
    position: relative;
    width: 100%;
    max-width: 900px;
    height: 250px;
    margin: 20px 0;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
  }
  
  .album-image {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center;
    z-index: 1;
    transition: clip-path 0.1s linear;
  }
  
  #waveform {
    position: relative;
    width: 100%; 
    height: 100%;
    z-index: 2;
    opacity: 0.5;
    filter: grayscale(100%);
  }
  
  .controls button { margin: 5px; padding: 10px 20px; font-size: 16px; cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }

  .player-controls {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    gap: 20px;
    z-index: 3;
    opacity: 0;                 
    transition: opacity 0.3s ease;
  }
  .waveform-wrapper:hover .player-controls { opacity: 1; }
  @media (hover: none) { .player-controls { opacity: 1; } }
  
  .player-controls button {
    appearance: none; -webkit-appearance: none; -moz-appearance: none;
    -webkit-tap-highlight-color: transparent; outline: none; border: none;
    border-radius: 50%; width: 55px; height: 55px;
    background: rgba(0,0,0,0.6); cursor: pointer;
    backdrop-filter: blur(5px);
    transition: all 0.2s ease;
    display: flex; justify-content: center; align-items: center; padding: 0;
  }
  .player-controls .play-btn { width: 70px; height: 70px; }
  .player-controls button svg { width: 60%; height: 60%; }
  .player-controls button:hover { background: rgba(255,255,255,0.25); transform: scale(1.1); }
  .player-controls button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .feedback-overlay {
    position: absolute; bottom: 15px; right: 15px;
    display: flex; gap: 12px; z-index: 4;
  }
  .feedback-btn {
    appearance: none; -webkit-appearance: none; -webkit-tap-highlight-color: transparent;
    border: none; border-radius: 50%; width: 50px; height: 50px; font-size: 18px;
    display: flex; justify-content: center; align-items: center;
    background: rgba(0,0,0,0.5); color: white; cursor: pointer;
    backdrop-filter: blur(5px); transition: all 0.2s ease;
  }
  .feedback-btn:hover { background: rgba(255,255,255,0.25); transform: scale(1.1); }
  .feedback-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .like-btn { background: rgba(0,200,0,0.5); }
  .dislike-btn { background: rgba(200,0,0,0.5); }
  
  .mix-list {
    width: 100%;
    max-width: 900px; 
    padding: 5px;
    margin-top: 20px;
  }
  .mix-item {
    display: flex; align-items: center;
    font-size: 14px;
    padding: 6px 0;
  }
  .mix-name {
    max-width: 45%; 
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    flex-shrink: 0; 
    margin-right: 10px; 
  }
  .dots {
    flex: 1; 
    border-bottom: 1px dotted rgba(255,255,255,0.3);
    margin: 0 6px;
  }
  .mix-waveform {
    width: 150px; 
    height: 60px; 
    margin-right: 10px;
    cursor: pointer; 
  }
  .mix-controls {
    display: flex; align-items: center;
    gap: 5px; 
  }
  .mix-play {
    background: none; border: none; color: white; font-size: 18px; 
    cursor: pointer; margin-right: 6px;
    padding: 0; width: 40px; height: 40px;
    display: flex; justify-content: center; align-items: center;
    border-radius: 50%; 
    background: rgba(255,255,255,0.2);
    transition: background 0.2s ease;
  }
  .mix-play:hover { background: rgba(255,255,255,0.4); }

  .mix-control-btn {
    background: none; border: none; color: white; font-size: 12px; 
    cursor: pointer; margin: 0 4px; padding: 2px 4px;
  }
  .mix-control-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .mix-control-btn:hover:not(:disabled) { opacity: 0.8; }
  
  .mix-time {
    font-size: 12px;
    opacity: 0.7;
    min-width: 70px; 
    text-align: right;
  }

  .previous-songs {
    margin-top: 20px; margin-bottom: 10px;
    font-size: 14px; color: rgba(255, 255, 255, 0.4);
  }
  .prev-song { padding: 3px 0; }
  
  .time-display {
    font-size: 1.2em; margin-top: 10px;
  }

  .start-message {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 24px; color: rgba(255,255,255,0.8);
    z-index: 100; cursor: pointer; text-align: center;
  }
    
</style>
</head>
<body>
  <div id="app">
    <div class="container" :style="{ backgroundColor: bgColor, color: textColor }">

      <!-- Mode switch -->
      <div class="mode-switch">
        <button @click="toggleMode" :disabled="isLoading">
          {{ mode === 'mp3' ? 'Go to MIX list' : 'Back to single MP3' }}
        </button>
      </div>

      <!-- Historique des 3 MP3 précédents -->
      <div v-if="mode === 'mp3' && songHistory.length > 0" class="previous-songs">
        <div v-for="(song, idx) in songHistory.slice(1).reverse()" :key="idx" class="prev-song">
          {{ song }}
        </div>
      </div>
      
      <!-- Titre chanson MP3 -->
      <h1 v-if="mode === 'mp3'">{{ songName }}</h1>

      <!-- Description MP3 -->
      <p v-if="mode === 'mp3'" style="color: #0099ff; font-size: 14px; max-width: 600px; margin: 10px auto;">
        {{ songDescription }}
      </p>
      
      <!-- Bloc MP3 -->
      <div v-if="mode === 'mp3'" class="waveform-wrapper">
        <!-- Image album -->
        <div class="album-image"
             :style="{ 
               backgroundImage: `url('${imageUrl}')`,
               clipPath: `inset(0 ${100 - progressPercent}% 0 0)`
             }">
        </div>
        <!-- Waveform pour le MP3 -->
        <div id="waveform"></div>
        <!-- Boutons overlay pour le MP3 -->
        <div class="player-controls">
          <button @click="previousSong" :disabled="isLoading">
            <svg viewBox="0 0 24 24"><polygon points="11,12 22,4 22,20" fill="white"/><rect x="2" y="4" width="3" height="16" fill="white"/></svg>
          </button>
          <button type="button" class="play-btn" @click="togglePlay" :disabled="!isSongReady || isLoading">
            <svg v-if="!isPlaying" viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21" fill="white"/></svg>
            <svg v-else viewBox="0 0 24 24"><rect x="5" y="3" width="5" height="18" fill="white"/><rect x="14" y="3" width="5" height="18" fill="white"/></svg>
          </button>
          <button @click="replaySong" :disabled="!isSongReady || isLoading">
            <svg viewBox="0 0 24 24"><path d="M12 5V1L8 5l4 4V6c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6h-2c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z" fill="white"/></svg>
          </button>
          <button @click="nextSong" :disabled="isLoading">
            <svg viewBox="0 0 24 24"><polygon points="13,12 2,4 2,20" fill="white"/><rect x="19" y="4" width="3" height="16" fill="white"/></svg>
          </button>
        </div>
      </div> <!-- fin waveform-wrapper MP3 -->
      <!-- Temps MP3 -->
      <div v-if="mode === 'mp3'" class="time-display">{{ currentTime }} / {{ duration }}</div>

      <!-- Lecteur audio caché pour les mixes -->
      <audio ref="mixPlayer" style="display:none;"></audio>

      <!-- Bloc Mix (LISTE AVEC WAVEFORMS INTERACTIVES) -->
      <div v-if="mode === 'mix'" class="mix-list">
        <div
          v-for="mix in mixList"
          :key="mix.fileName"
          :class="['mix-item', { active: currentMix === mix.fileName && isMixPlaying }]"
        >
          <!-- Nom du Mix -->
          <span class="mix-name" :title="mix.name">{{ mix.name }}</span>
          
          <!-- Conteneur pour la Waveform interactive -->
          <div :id="'waveform-' + mix.fileName.replace(/[^a-zA-Z0-9]/g, '-').toLowerCase()" class="mix-waveform" @click="seekMix(mix, $event)"></div>

          <!-- Bouton Play/Pause pour le Mix -->
          <button class="mix-play" @click="toggleMixPlayPause(mix)">
            {{ currentMix === mix.fileName && isMixPlaying ? '⏸' : '▶' }}
          </button>

          <!-- Affichage du temps -->
          <span class="mix-time">
            {{ currentMix === mix.fileName ? formatTime(mixCurrentTime) + ' / ' + formatTime(mixDuration) : '0:00 / 0:00' }}
          </span>
        </div>
      </div>
      
      <!-- Feedback overlay (pour MP3) -->
      <div class="feedback-overlay">
        <button class="feedback-btn like-btn" @click="likeSong" :disabled="hasVoted">❤️ {{ globalLikeCount }}</button>
        <button class="feedback-btn dislike-btn" @click="dislikeSong" :disabled="hasVoted">👎 {{ globalDislikeCount }}</button>
      </div>

      <!-- Message "Clique pour commencer" -->
      <div v-if="!userInteracted && isSongReady" class="start-message">
        👆 Start music
      </div>
    </div> <!-- fin container -->
  </div> <!-- fin app -->

<script>
const { createApp } = Vue;

createApp({
  data() {
    return {
      mode: 'mp3', // 'mp3' ou 'mix'
      songName: 'Chargement...',
      songUrl: '',
      imageUrl: '',
      fileName: '',
      wavesurfer: null,
      isPlaying: false,
      isSongReady: false,
      isLoading: false,
      currentTime: '0:00',
      duration: '0:00',
      hasVoted: false,
      globalLikeCount: 0,
      globalDislikeCount: 0,
      bgColor: '#000',
      textColor: '#fff',
      userInteracted: false,
      progressPercent: 0,
      songHistory: [],
      songDescription: '',

      // --- Variables pour le mode MIX ---
      mixList: [],
      currentMix: null,
      mixPlayer: null,
      mixCurrentTime: 0,
      mixDuration: 0,
      mixWaveSurfers: {},
      isMixPlaying: false,
      mixInfoCache: {}, // ← Cache pour les infos des mixes
    };
  },

  mounted() {
    console.log('🚀 App mounted');

    // --- Initialisation WaveSurfer pour le mode MP3 ---
    const mp3WaveformContainer = document.getElementById('waveform');
    if (mp3WaveformContainer) {
      this.wavesurfer = WaveSurfer.create({
        container: '#waveform',
        waveColor: '#FFFFFF',
        progressColor: 'transparent',
        barWidth: 2,
        height: 250,
        responsive: true,
        cursorWidth: 2,
        cursorColor: '#fff',
        hideScrollbar: true,
      });

      this.wavesurfer.on('audioprocess', () => {
        this.currentTime = this.formatTime(this.wavesurfer.getCurrentTime());
        this.progressPercent = (this.wavesurfer.getCurrentTime() / this.wavesurfer.getDuration()) * 100;
      });

      this.wavesurfer.on('finish', () => {
        this.isPlaying = false;
        this.loadNextSong();
      });

      this.wavesurfer.once('ready', () => {
        this.isSongReady = true;
        this.duration = this.formatTime(this.wavesurfer.getDuration());
        console.log('✅ WaveSurfer MP3 ready');
      });
    } else {
      console.error("❌ Conteneur #waveform introuvable pour le mode MP3");
    }

    // Listeners pour déverrouiller l'autoplay
    document.addEventListener('click', () => this.handleUserInteraction());
    document.addEventListener('touchstart', () => this.handleUserInteraction());
    document.addEventListener('keydown', () => this.handleUserInteraction());

    // --- Initialisation pour le mode MIX ---
    this.mixPlayer = this.$refs.mixPlayer;
    this.setupMixPlayerEvents();

    // Charger la liste des mixes si applicable
    if (this.mode === 'mix') {
      this.fetchMixList();
    } else {
      // Charger le premier MP3 si en mode MP3
      if (!this.isLoading && !this.isSongReady) {
        this.loadNextSong();
      }
    }
  },

  beforeDestroy() {
    if (this.wavesurfer) this.wavesurfer.destroy();
    Object.values(this.mixWaveSurfers).forEach(ws => {
      if (ws) ws.destroy();
    });
    document.removeEventListener('click', this.handleUserInteraction);
    document.removeEventListener('touchstart', this.handleUserInteraction);
    document.removeEventListener('keydown', this.handleUserInteraction);
  },

  methods: {
    // --- Gestion de l'interaction utilisateur ---
    handleUserInteraction() {
      if (!this.userInteracted) {
        console.log('✅ Autoplay déverrouillé');
        this.userInteracted = true;
        document.removeEventListener('click', this.handleUserInteraction);
        document.removeEventListener('touchstart', this.handleUserInteraction);
        document.removeEventListener('keydown', this.handleUserInteraction);

        if (this.mode === 'mp3' && this.isSongReady) {
          this.playAudio();
        } else if (this.mode === 'mp3' && !this.isSongReady && !this.isLoading) {
          this.loadNextSong();
        }
      }
    },

    // --- Méthodes pour le mode MP3 ---
    async playAudio() {
      if (!this.wavesurfer || !this.isSongReady) return;
      try {
        await this.wavesurfer.play();
        this.isPlaying = true;
      } catch (e) {
        console.error('❌ Erreur playAudio:', e);
      }
    },

    pauseAudio() {
      if (this.wavesurfer) {
        this.wavesurfer.pause();
        this.isPlaying = false;
      }
    },

    togglePlay() {
      if (this.isPlaying) {
        this.pauseAudio();
      } else {
        this.playAudio();
      }
    },

    async replaySong() {
      if (!this.wavesurfer || !this.isSongReady) return;
      this.wavesurfer.seek(0);
      await this.playAudio();
    },

    async loadNextSong() {
      this.isLoading = true;
      try {
        const res = await axios.get('/api/next-song?mode=mp3', { withCredentials: true });
        const data = res.data;

        this.songName = data.songName;
        this.songUrl = data.url;
        this.fileName = data.fileName;
        this.imageUrl = data.imageUrl || '';
        this.songDescription = data.description || '';
        this.globalLikeCount = data.likeCount || 0;
        this.globalDislikeCount = data.dislikeCount || 0;
        this.hasVoted = false;

        this.updateSongHistory(this.songName);

        if (this.wavesurfer) {
          this.isSongReady = false;
          this.wavesurfer.load(this.songUrl);
        }
      } catch (e) {
        console.error('❌ loadNextSong error:', e);
      } finally {
        this.isLoading = false;
      }
    },

    async loadPreviousSong() {
      this.isLoading = true;
      try {
        const res = await axios.get('/api/previous-song?mode=mp3', { withCredentials: true });
        const data = res.data;

        this.songName = data.songName;
        this.songUrl = data.url;
        this.fileName = data.fileName;
        this.imageUrl = data.imageUrl || '';
        this.songDescription = data.description || '';
        this.globalLikeCount = data.likeCount || 0;
        this.globalDislikeCount = data.dislikeCount || 0;
        this.hasVoted = false;

        this.updateSongHistory(this.songName);

        if (this.wavesurfer) {
          this.isSongReady = false;
          this.wavesurfer.load(this.songUrl);
        }
      } catch (e) {
        console.error('❌ loadPreviousSong error:', e);
      } finally {
        this.isLoading = false;
      }
    },

    nextSong() {
      this.loadNextSong();
    },

    previousSong() {
      this.loadPreviousSong();
    },

    resetPlayerState(resetUrl = false) {
      this.isPlaying = false;
      this.isSongReady = false;
      this.hasVoted = false;
      if (resetUrl) this.songUrl = '';
    },

    // --- Méthodes pour le mode MIX ---

    // Configure les événements de l'élément audio HTML pour les mixes
    setupMixPlayerEvents() {
      if (!this.mixPlayer) {
        console.error('❌ mixPlayer non disponible');
        return;
      }

      this.mixPlayer.addEventListener('timeupdate', () => {
        this.mixCurrentTime = this.mixPlayer.currentTime;
      });

      this.mixPlayer.addEventListener('loadedmetadata', () => {
        this.mixDuration = this.mixPlayer.duration;
        console.log(`📊 Mix metadata loaded: duration = ${this.mixDuration}s`);
      });

      this.mixPlayer.addEventListener('ended', () => {
        this.isMixPlaying = false;
        this.mixCurrentTime = 0;
        console.log('✅ Mix finished');
      });

      this.mixPlayer.addEventListener('play', () => {
        this.isMixPlaying = true;
        console.log('▶️ Mix playing');
      });

      this.mixPlayer.addEventListener('pause', () => {
        this.isMixPlaying = false;
        console.log('⏸️ Mix paused');
      });

      this.mixPlayer.addEventListener('error', (e) => {
        console.error('❌ Mix player error:', e);
        this.isMixPlaying = false;
      });
    },

    async fetchMixList() {
  try {
    const res = await axios.get('/api/mix-list', { withCredentials: true });
    this.mixList = res.data.map(mix => ({
      ...mix,
      waveformJsonUrl: `https://storage.googleapis.com/musica-mix-bucket/waveforms/${mix.fileName.replace('.mp3', '')}.json`
    }));
    console.log('✅ Mix List received:', this.mixList);

    if (this.mode === 'mix' && this.mixList.length > 0) {
      this.$nextTick(() => {
        this.mixList.forEach(mix => this.initMixWaveformContainer(mix));
      });
    }
  } catch (err) {
    console.error('❌ Erreur /api/mix-list:', err);
  }
},

    // Initialise le conteneur WaveSurfer pour une waveform de mix
    initMixWaveformContainer(mix) {
      if (!mix || !mix.fileName || !mix.url || !mix.waveformJsonUrl) {
        console.warn('⚠️ Mix invalide ou incomplet:', mix);
        return;
      }

      // Créer un ID sûr pour le conteneur
      const safeFileName = mix.fileName.replace(/[^a-zA-Z0-9]/g, '-').toLowerCase();
      const waveformId = `waveform-${safeFileName}`;

      const container = document.getElementById(waveformId);

      if (!container) {
        console.error(`❌ Conteneur non trouvé pour la waveform du mix '${mix.fileName}' avec l'ID : #${waveformId}`);
        return;
      }

      try {
        const ws = WaveSurfer.create({
          container: `#${waveformId}`,
          waveColor: '#ffffff',
          progressColor: '#ff0000',
          barWidth: 3,
          barGap: 1,
          height: 40,
          responsive: true,
          cursorWidth: 2,
          cursorColor: '#fff',
          hideScrollbar: true,
        });

        // Stocker l'instance WaveSurfer
        this.mixWaveSurfers[mix.fileName] = ws;

        // Stocker les infos du mix
        this.mixInfoCache[mix.fileName] = {
          url: mix.url,
          waveformJsonUrl: mix.waveformJsonUrl,
          duration: 0,
        };

        // Événements WaveSurfer pour ce mix
        ws.on('ready', () => {
          const duration = ws.getDuration();
          if (duration && duration > 0) {
            this.mixInfoCache[mix.fileName].duration = duration;
            console.log(`✅ WaveSurfer ready for ${mix.fileName}: ${duration}s`);
          }
        });

        ws.on('audioprocess', (time) => {
          if (this.currentMix === mix.fileName) {
            this.mixCurrentTime = time;
          }
        });

        ws.on('seeking', (time) => {
          if (this.currentMix === mix.fileName && this.mixPlayer) {
            this.mixPlayer.currentTime = time;
          }
        });

        ws.on('finish', () => {
          if (this.currentMix === mix.fileName) {
            this.isMixPlaying = false;
            this.mixCurrentTime = 0;
          }
        });

        // Charger la waveform JSON
        ws.load(mix.waveformJsonUrl);

        console.log(`✅ WaveSurfer initialized for: ${mix.fileName}`);
      } catch (e) {
        console.error(`❌ Erreur lors de la création de WaveSurfer pour ${mix.fileName}:`, e);
      }
    },

    // Gère le clic sur la waveform pour chercher la position
    seekMix(mix, event) {
      const ws = this.mixWaveSurfers[mix.fileName];
      if (!ws || this.currentMix !== mix.fileName) return;

      const waveWrapper = event.currentTarget;
      const clickX = event.offsetX;
      const waveWidth = waveWrapper.offsetWidth;

      const duration = this.mixPlayer.duration || ws.getDuration() || 0;
      if (duration === 0 || !isFinite(duration)) {
        console.warn('⚠️ Durée non disponible pour le seek');
        return;
      }

      const seekPercent = clickX / waveWidth;
      const seekTime = duration * seekPercent;

      if (this.mixPlayer) this.mixPlayer.currentTime = seekTime;
      ws.seek(seekTime);
      this.mixCurrentTime = seekTime;
    },

    // Gère le Play/Pause pour un mix
    toggleMixPlayPause(mix) {
      const ws = this.mixWaveSurfers[mix.fileName];
      if (!ws) {
        console.error(`❌ WaveSurfer instance not found for mix: ${mix.fileName}`);
        return;
      }

      if (this.currentMix === mix.fileName && this.isMixPlaying) {
        // Pause le mix en cours
        if (this.mixPlayer) this.mixPlayer.pause();
        ws.pause();
        this.isMixPlaying = false;
      } else {
        // Démarre un nouveau mix
        this.currentMix = mix.fileName;

        // Pause le MP3 s'il est en cours
        if (this.wavesurfer && !this.wavesurfer.isPaused()) {
          this.wavesurfer.pause();
          this.isPlaying = false;
        }

        // Récupère les infos du mix
        const mixInfo = this.mixInfoCache[mix.fileName];
        if (!mixInfo || !mixInfo.url) {
          console.error('❌ Informations du mix (URL) non trouvées:', mix.fileName);
          return;
        }

        // Lance la lecture audio
        this.mixPlayer.src = mixInfo.url;
        this.mixPlayer.play()
          .then(() => {
            this.isMixPlaying = true;
            console.log(`▶️ Lecture du mix : ${mix.fileName}`);
          })
          .catch(e => {
            console.error('❌ Erreur lors de la lecture du mix audio:', e);
            this.isMixPlaying = false;
          });
      }
    },

    // Bascule entre le mode MP3 et MIX
    async toggleMode() {
      this.isLoading = true;

      // Arrête la lecture actuelle
      if (this.mode === 'mp3' && this.isPlaying) {
        this.pauseAudio();
      } else if (this.mode === 'mix' && this.isMixPlaying) {
        if (this.mixPlayer) this.mixPlayer.pause();
        if (this.currentMix && this.mixWaveSurfers[this.currentMix]) {
          this.mixWaveSurfers[this.currentMix].pause();
        }
        this.isMixPlaying = false;
        this.mixCurrentTime = 0;
        this.currentMix = null;
      }

      // Bascule le mode
      this.mode = this.mode === 'mp3' ? 'mix' : 'mp3';

      if (this.mode === 'mp3') {
        // Passage en mode MP3
        await this.$nextTick();
        try {
          const res = await axios.get('/api/next-song?mode=mp3', { withCredentials: true });
          const data = res.data;

          this.songName = data.songName;
          this.songUrl = data.url;
          this.fileName = data.fileName;
          this.imageUrl = data.imageUrl || '';
          this.songDescription = data.description || '';
          this.globalLikeCount = data.likeCount || 0;
          this.globalDislikeCount = data.dislikeCount || 0;

          // Recrée l'instance WaveSurfer
          if (this.wavesurfer) this.wavesurfer.destroy();
          this.wavesurfer = WaveSurfer.create({
            container: '#waveform',
            waveColor: '#FFFFFF',
            progressColor: 'transparent',
            barWidth: 2,
            height: 250,
            responsive: true,
            cursorWidth: 2,
            cursorColor: '#fff',
            hideScrollbar: true,
          });

          this.wavesurfer.on('audioprocess', () => {
            this.currentTime = this.formatTime(this.wavesurfer.getCurrentTime());
            this.progressPercent = (this.wavesurfer.getCurrentTime() / this.wavesurfer.getDuration()) * 100;
          });

          this.wavesurfer.on('finish', () => {
            this.isPlaying = false;
            this.loadNextSong();
          });

          this.wavesurfer.once('ready', () => {
            this.isSongReady = true;
            this.duration = this.formatTime(this.wavesurfer.getDuration());
          });

          this.wavesurfer.load(this.songUrl);
        } catch (e) {
          console.error('❌ Erreur lors du basculement vers le mode MP3:', e);
        } finally {
          this.isLoading = false;
        }
      } else {
        // Passage en mode MIX
        await this.$nextTick();
        if (this.mixList.length === 0) {
          await this.fetchMixList();
        }
        this.isLoading = false;
      }
    },

    // Mise à jour de l'historique des chansons
    updateSongHistory(songName) {
      this.songHistory.unshift(songName);
      if (this.songHistory.length > 7) {
        this.songHistory.pop();
      }
    },

    // --- Feedback (Likes/Dislikes) ---
    async likeSong() {
      if (this.hasVoted) return;
      await this.sendFeedback('like');
    },

    async dislikeSong() {
      if (this.hasVoted) return;
      await this.sendFeedback('dislike');
    },

    async sendFeedback(feedbackType) {
      if (this.mode === 'mp3' && this.fileName) {
        try {
          this.hasVoted = true;
          const res = await axios.post(
            '/api/song-feedback',
            { songName: this.fileName, feedback: feedbackType },
            { withCredentials: true }
          );
          this.globalLikeCount = res.data.likeCount || 0;
          this.globalDislikeCount = res.data.dislikeCount || 0;
          console.log(`✅ Feedback ${feedbackType} envoyé`);
        } catch (err) {
          console.error(`❌ Feedback ${feedbackType} error:`, err);
          this.hasVoted = false;
        }
      }
    },

    // Formatage du temps
    formatTime(sec) {
      if (!sec || !isFinite(sec)) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' + s : s}`;
    },
  }
}).mount('#app');
</script>
</body>
</html>
